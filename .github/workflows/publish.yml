# ⚠️  This workflow belongs to the PUBLIC repo todenhq/toden-react-native, where
# it is committed as `.github/workflows/publish.yml` (NOT under this file's name —
# this is only the canonical copy kept with the source). It is intentionally
# excluded from the monorepo → public-repo sync, so a change here does NOT ship:
# it must be committed to the public repo by hand. Each sync preserves the public
# repo's .github/, so it survives every release.
#
# Unlike the web SDK, the RN package ships its TypeScript source + native code
# (no bundling step — `main` points at `src/index.ts`), so there is no build here.
#
# Required secret in todenhq/toden-react-native: NPM_TOKEN (npm automation token).
name: Publish @toden/react-native to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 20 (npm registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Publish to npm (skip if this version already exists)
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Resolved package: $NAME@$VERSION"
          PUBLISHED=$(npm view "$NAME@$VERSION" version 2>/dev/null || true)
          if [ -n "$PUBLISHED" ]; then
            echo "✓ $NAME@$VERSION is already on npm — skipping publish."
            exit 0
          fi
          echo "Publishing $NAME@$VERSION to npm…"
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
